# =============================================================================
# PHARMACY IDENTITY SERVICE METADATA AND TOOL CONFIGURATION
#
# This project currently runs:
#
# - Python 3.12+
# - FastAPI and Uvicorn
# - Pydantic 2
# - SQLAlchemy 2 with asyncpg/PostgreSQL
# - Redis and optional MongoDB integrations
#
# Runtime dependencies remain in requirements.txt. Development and test tools
# remain in requirements-dev.txt. This file intentionally contains no Python
# dependency lists and is not used to install the service environment.
# =============================================================================


# =============================================================================
# PROJECT METADATA
# =============================================================================

[project]
name = "pharmacy-identity-service"
version = "1.0.0"

description = """
Production-focused authentication, session, OTP, profile, and database-backed
authorization service for the healthcare platform.
"""

readme = "README.md"

requires-python = ">=3.12,<3.15"

license = { text = "Proprietary" }

authors = [
    { name = "Development Team" },
]

maintainers = [
    { name = "Development Team" },
]

keywords = [
    "authentication",
    "authorization",
    "fastapi",
    "healthcare",
    "jwt",
    "microservice",
    "postgresql",
    "redis",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]


# Python dependencies are intentionally not declared here. Install them only
# through requirements.txt and requirements-dev.txt.


# =============================================================================
# SETUPTOOLS PACKAGE DISCOVERY
#
# This metadata describes the importable source tree if packaging is needed.
# It does not install or resolve dependencies.
# =============================================================================

[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = [
    "tests*",
    "docs*",
]


# =============================================================================
# PYTEST
# =============================================================================

[tool.pytest.ini_options]
minversion = "8.0"

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--showlocals",
    "--tb=short",
]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = [
    "unit: Isolated test without external infrastructure.",
    "contract: OpenAPI, architecture, and public response-contract validation.",
    "integration: Test requiring a separately migrated PostgreSQL database.",
    "api: FastAPI endpoint or middleware test.",
    "slow: Test that takes longer than the normal unit-test suite.",
]


# =============================================================================
# COVERAGE
#
# Coverage collection is configured here but is not forced into every pytest
# invocation. Run it with the coverage tooling installed from the development
# requirements used by the local or CI environment.
# =============================================================================

[tool.coverage.run]
branch = true
parallel = true

source = [
    "app",
]

omit = [
    "tests/*",
]


[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
precision = 2

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]


[tool.coverage.html]
directory = "htmlcov"


[tool.coverage.xml]
output = "coverage.xml"


# =============================================================================
# RUFF
# =============================================================================

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4

src = [
    "app",
    "tests",
]

extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "htmlcov",
]


[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # import sorting
    "B",      # flake8-bugbear
    "ASYNC",  # asynchronous-code checks
    "S",      # security checks
    "UP",     # supported-Python syntax upgrades
    "SIM",    # simplification checks
    "RUF",    # Ruff-specific rules
]

ignore = [
    # Assertions are used for internal type narrowing after validated branches.
    "S101",
]


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    # Tests use assert directly by design.
    "S101",
]


[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

known-first-party = [
    "app",
]

section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 100


# =============================================================================
# MYPY
# =============================================================================

[tool.mypy]
python_version = "3.12"

plugins = [
    "pydantic.mypy",
]

files = [
    "app",
]

exclude = [
    "^tests/",
    "^build/",
    "^dist/",
]

strict = true

show_error_codes = true
show_column_numbers = true
pretty = true

warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

no_implicit_optional = true
strict_equality = true

# SQLAlchemy 2 provides native typing and does not require its legacy plugin.
namespace_packages = true
explicit_package_bases = true


# =============================================================================
# PYDANTIC MYPY PLUGIN
# =============================================================================

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
