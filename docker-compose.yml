# File: docker-compose.yml

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:-5555}

    ports:
      - "${PORT:-5555}:${PORT:-5555}"

    init: true
    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"